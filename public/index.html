<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevBridge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="status-bar" class="status-bar">Status: connecting&hellip;</header>

  <div class="layout">
    <aside class="navigator">
      <h2>Projects</h2>
      <div id="project-tree"></div>
      <button id="sign-in-button" type="button">Sign In</button>
    </aside>

    <main>
      <div id="session-detail" class="empty">Select a session to view its activity.</div>
    </main>
  </div>

  <div id="login-overlay" class="login-overlay" hidden>
    <div class="login-panel">
      <h3>Sign in</h3>
      <p id="login-status">Starting&hellip;</p>

      <div id="login-link-area" hidden>
        <a id="login-url-link" target="_blank" rel="noopener noreferrer"></a>
      </div>

      <pre id="login-raw-output" class="login-raw-output"></pre>

      <div class="login-input-row">
        <input id="login-input-field" type="text" placeholder="Type a response, or use ↑/↓ then Enter for menus" />
        <button id="login-send-button" type="button">Send</button>
      </div>

      <div class="login-actions">
        <button id="login-signed-in-button" type="button">I'm signed in</button>
        <button id="login-cancel-button" type="button">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
