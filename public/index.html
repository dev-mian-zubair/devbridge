<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevBridge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="status-bar" class="status-bar">Status: unknown</header>

  <div class="layout">
    <aside class="navigator">
      <h2>Sessions</h2>
      <ul id="session-list"></ul>

      <form id="add-session-form">
        <input id="session-id-input" type="text" placeholder="sessionId" required />
        <input id="project-path-input" type="text" placeholder="/app/workspace/project" required />
        <button type="submit">Add session</button>
      </form>

      <button id="auth-button" type="button">Sign In</button>
      <div id="auth-link" hidden></div>
    </aside>

    <main>
      <div id="terminal"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
